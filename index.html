<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🛒 Mi Despensa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'Inter', sans-serif; }
    /* ── Smooth tab transition ── */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    /* ── Scrollbar refinement ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 999px; }
    /* ── Category color pills ── */
    .cat-verdura  { background:#dcfce7; color:#166534; }
    .cat-fruta    { background:#fef9c3; color:#854d0e; }
    .cat-carne    { background:#fee2e2; color:#991b1b; }
    .cat-cereal   { background:#fef3c7; color:#78350f; }
    .cat-lacteos  { background:#ede9fe; color:#5b21b6; }
    .cat-legumbres{ background:#d1fae5; color:#065f46; }
    .cat-bebidas  { background:#e0f2fe; color:#075985; }
    .cat-otros    { background:#f1f5f9; color:#475569; }
    /* ── Card hover lift ── */
    .product-card {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .product-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.10);
    }
    /* ── Alert pulse ── */
    @keyframes gentle-pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .75; }
    }
    .alert-pulse { animation: gentle-pulse 2.5s ease-in-out infinite; }
    /* ── :user-invalid native validation ── */
    input:user-invalid, select:user-invalid {
      border-color: #ef4444 !important;
      background-color: #fef2f2 !important;
    }
    input:user-valid { border-color: #22c55e !important; }
    /* ── Checkbox custom style ── */
    .item-check:checked + label span.item-name {
      text-decoration: line-through;
      opacity: 0.5;
    }
